services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feedback_analytics
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/00_demo_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql/03_analytics.sql:/docker-entrypoint-initdb.d/03_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql://feedback:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedback_analytics
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
