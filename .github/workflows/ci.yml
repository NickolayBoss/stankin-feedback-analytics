name: SQL and dashboard CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: feedback_analytics
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U feedback -d feedback_analytics"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q dashboard.py && python -m pytest -q
      - name: PostgreSQL integration
        run: |
          for file in sql/00_demo_schema.sql sql/02_seed.sql sql/03_analytics.sql sql/04_trends.sql sql/05_quality.sql; do
            psql -h localhost -p 5432 -U feedback -d feedback_analytics -v ON_ERROR_STOP=1 -f "$file" > /dev/null
          done
          test "$(psql -h localhost -U feedback -d feedback_analytics -Atc 'SELECT count(*) FROM feedback')" = "500"
          test "$(psql -h localhost -U feedback -d feedback_analytics -Atc 'SELECT count(*) FROM kpi_overview')" = "1"
          test "$(psql -h localhost -U feedback -d feedback_analytics -Atc "SELECT count(*) FROM feedback WHERE status='resolved' AND resolved_at IS NULL")" = "0"
